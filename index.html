<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EControl // OMNI-INVENTORY MATRIX</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-green: #008f11;
            --bg-color: #0d0d0d;
            --panel-bg: rgba(0, 20, 0, 0.85);
            --border-glow: #00ff41;
            --alert-red: #ff003c;
            --text-dim: #005000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            height: 100vh;
            overflow: hidden;
        }

        /* Matrix Canvas Background */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Workspace container */
        #workspace {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
            overflow: hidden;
        }

        /* Draggable Windows */
        .window {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--dark-green);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1), inset 0 0 10px rgba(0, 255, 65, 0.05);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            min-width: 300px;
        }

        .window.active {
            border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.3), inset 0 0 15px rgba(0, 255, 65, 0.1);
            z-index: 100 !important;
        }

        .win-header {
            background: var(--dark-green);
            color: #000;
            padding: 8px 15px;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-green);
        }

        .win-header:active { cursor: grabbing; }
        .win-content { padding: 15px; flex: 1; overflow-y: auto; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #001100; }
        ::-webkit-scrollbar-thumb { background: var(--dark-green); }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        /* Forms & Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--dark-green); margin-bottom: 4px; text-transform: uppercase; }
        
        input, select {
            width: 100%;
            background: #000;
            border: 1px solid var(--dark-green);
            color: var(--neon-green);
            padding: 8px;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        
        input:focus, select:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        button {
            width: 100%;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Inventory Grid & Items */
        .inv-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        
        .inv-item {
            border: 1px solid var(--dark-green);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            position: relative;
        }

        .inv-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--neon-green);
        }

        .inv-item.critical::before { background: var(--alert-red); box-shadow: 0 0 10px var(--alert-red); animation: blink 1s infinite; }
        .inv-item.critical .stock-num { color: var(--alert-red); text-shadow: 0 0 5px var(--alert-red); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .item-meta { display: flex; flex-direction: column; gap: 4px; }
        .item-sku { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; }
        .item-name { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; }
        
        .stock-container { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
        .stock-num { font-size: 1.5rem; font-weight: bold; }
        
        /* Progress Bar */
        .stock-bar-bg { width: 100px; height: 6px; background: #002200; margin-top: 5px; }
        .stock-bar-fill { height: 100%; background: var(--neon-green); transition: width 0.3s; }
        .inv-item.critical .stock-bar-fill { background: var(--alert-red); }

        /* Delete action */
        .del-action {
            font-size: 0.7rem; color: var(--dark-green); cursor: pointer; margin-top: 5px; text-align: right; text-decoration: underline;
        }
        .del-action:hover { color: var(--alert-red); }

        /* System Metrics */
        .metric-box {
            border: 1px solid var(--dark-green); padding: 15px; margin-bottom: 15px; text-align: center;
        }
        .metric-val { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 10px var(--neon-green); margin: 10px 0; }
    </style>
</head>
<body>

    <!-- Environment Background -->
    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>

    <!-- Draggable Workspace -->
    <div id="workspace">

        <!-- PANEL 1: CONTROL INGESTION -->
        <div class="window" style="top: 50px; left: 50px; width: 320px;" id="win-ingest">
            <div class="win-header">
                <span>[ ECONTROL INGEST ]</span>
                <span>_</span>
            </div>
            <div class="win-content">
                <div class="input-group">
                    <label>Designación de Activo</label>
                    <input type="text" id="itemName" placeholder="Ej. Servidor Blade..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Categoría</label>
                    <select id="itemCat">
                        <option value="Hardware">Hardware / Equipos</option>
                        <option value="Componentes">Componentes Internos</option>
                        <option value="Suministros">Suministros Generales</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>Stock Actual</label>
                        <input type="number" id="itemStock" placeholder="0" min="0">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Stock Óptimo</label>
                        <input type="number" id="itemMax" placeholder="100" min="1">
                    </div>
                </div>
                <button id="btnSubmit">Ejecutar Registro</button>
            </div>
        </div>

        <!-- PANEL 2: MAIN DATABASE -->
        <div class="window" style="top: 50px; left: 400px; width: 500px; height: 600px;" id="win-db">
            <div class="win-header">
                <span>[ ECONTROL CORE DATABASE ]</span>
                <span>[+]</span>
            </div>
            <div class="win-content">
                <ul class="inv-list" id="inventoryList">
                    <!-- JS Populated -->
                </ul>
            </div>
        </div>

        <!-- PANEL 3: METRICS & TELEMETRY -->
        <div class="window" style="top: 50px; left: 930px; width: 300px;" id="win-telemetry">
            <div class="win-header">
                <span>[ TELEMETRÍA ]</span>
                <span>x</span>
            </div>
            <div class="win-content">
                <div class="metric-box">
                    <div style="font-size:0.8rem; color:var(--dark-green);">TOTAL SKUS REGISTRADOS</div>
                    <div class="metric-val" id="totalSkus">0</div>
                </div>
                <div class="metric-box">
                    <div style="font-size:0.8rem; color:var(--dark-green);">ESTADO DEL SISTEMA</div>
                    <div class="metric-val" id="sysState" style="font-size:1.5rem;">ÓPTIMO</div>
                </div>
                <button id="btnWipe" style="border-color:var(--alert-red); color:var(--alert-red);">PURGAR BASE DE DATOS</button>
            </div>
        </div>

    </div>

    <script>
        /* =========================================
           1. MATRIX DIGITAL RAIN ENGINE
           ========================================= */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeMatrix() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeMatrix);
        resizeMatrix();

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
        const fontSize = 14;
        let columns = width / fontSize;
        let drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 13, 13, 0.1)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#005000'; // Darker text for background subtlety
            ctx.font = fontSize + 'px Consolas';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        /* =========================================
           2. WINDOW MANAGER (DRAGGABLE PANELS)
           ========================================= */
        const windows = document.querySelectorAll('.window');
        let zIndexCounter = 100;

        windows.forEach(win => {
            const header = win.querySelector('.win-header');
            let isDragging = false, startX, startY, initialX, initialY;

            // Bring to front on click
            win.addEventListener('mousedown', () => {
                windows.forEach(w => w.classList.remove('active'));
                win.classList.add('active');
                win.style.zIndex = ++zIndexCounter;
            });

            header.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialX = win.offsetLeft;
                initialY = win.offsetTop;
            });

            document.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                win.style.left = `${initialX + dx}px`;
                win.style.top = `${initialY + dy}px`;
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        });

        /* =========================================
           3. ECONTROL CORE LOGIC & LOCALSTORAGE
           ========================================= */
        
        // Initialize or load data
        let inventory = JSON.parse(localStorage.getItem('econtrol_data')) || [
            { id: 1693521001, name: "Unidades SSD 2TB", cat: "Hardware", stock: 45, max: 50, sku: "EC-HW-A1B2" },
            { id: 1693521002, name: "Cables de Fibra Óptica", cat: "Suministros", stock: 12, max: 100, sku: "EC-SU-X9Y8" }
        ];

        function generateSKU(cat) {
            const prefix = cat.substring(0, 2).toUpperCase();
            const hex = Math.random().toString(16).substr(2, 4).toUpperCase();
            return `EC-${prefix}-${hex}`;
        }

        function saveAndRender() {
            localStorage.setItem('econtrol_data', JSON.stringify(inventory));
            
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            
            let criticalCount = 0;

            inventory.forEach(item => {
                const stockPercent = Math.min((item.stock / item.max) * 100, 100);
                const isCritical = stockPercent <= 20;
                if (isCritical) criticalCount++;

                const li = document.createElement('li');
                li.className = `inv-item ${isCritical ? 'critical' : ''}`;
                li.innerHTML = `
                    <div class="item-meta">
                        <span class="item-sku">${item.sku} // ${item.cat}</span>
                        <span class="item-name">${item.name}</span>
                        <div class="del-action" onclick="deleteItem(${item.id})">[ ELIMINAR REGISTRO ]</div>
                    </div>
                    <div class="stock-container">
                        <span class="stock-num">${item.stock}</span>
                        <div class="stock-bar-bg">
                            <div class="stock-bar-fill" style="width: ${stockPercent}%"></div>
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });

            // Update Telemetry
            document.getElementById('totalSkus').textContent = inventory.length;
            const sysState = document.getElementById('sysState');
            
            if (criticalCount > 0) {
                sysState.textContent = `CRÍTICO (${criticalCount})`;
                sysState.style.color = 'var(--alert-red)';
                sysState.style.textShadow = '0 0 10px var(--alert-red)';
            } else {
                sysState.textContent = 'ÓPTIMO';
                sysState.style.color = 'var(--neon-green)';
                sysState.style.textShadow = '0 0 10px var(--neon-green)';
            }
        }

        window.deleteItem = function(id) {
            inventory = inventory.filter(i => i.id !== id);
            saveAndRender();
        };

        // Form Submit
        document.getElementById('btnSubmit').addEventListener('click', () => {
            const name = document.getElementById('itemName').value.trim();
            const cat = document.getElementById('itemCat').value;
            const stock = parseInt(document.getElementById('itemStock').value);
            const max = parseInt(document.getElementById('itemMax').value);

            if (name && !isNaN(stock) && !isNaN(max) && max > 0) {
                inventory.push({
                    id: Date.now(),
                    name, cat, stock, max,
                    sku: generateSKU(cat)
                });
                
                document.getElementById('itemName').value = '';
                document.getElementById('itemStock').value = '';
                document.getElementById('itemMax').value = '';
                
                saveAndRender();
            }
        });

        // Wipe Database
        document.getElementById('btnWipe').addEventListener('click', () => {
            if(confirm("⚠️ ADVERTENCIA: ¿Purgar toda la base de datos de EControl? Esta acción es irreversible.")){
                inventory = [];
                saveAndRender();
            }
        });

        // Init
        saveAndRender();
    </script>
</body>
</html>
